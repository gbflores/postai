<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Postaí</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📣</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header class="top">
    <div>
      <h1>📣 Postaí</h1>
      <p class="muted">Escreva uma vez e publique em todas as redes.</p>
    </div>
  </header>

  <div class="columns">
  <form id="composer" class="card composer">
    <fieldset class="networks">
      <legend>Publicar em</legend>
      <div id="networks" class="chips"></div>
    </fieldset>

    <div id="dropzone" class="editor">
      <label class="sr-only" for="text">Texto do post</label>
      <textarea id="text" rows="6" placeholder="O que você quer publicar?"></textarea>

      <div id="preview" class="preview" hidden>
        <img alt="Imagem anexada">
        <button type="button" id="removeImage" class="remove" aria-label="Remover imagem">×</button>
      </div>

      <div class="toolbar">
        <label class="tool" title="Anexar imagem (ou cole com Ctrl+V / arraste para cá)">
          <input type="file" id="image" accept="image/jpeg,image/png,image/webp" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm1 2v8.6l3.3-3.3a1 1 0 0 1 1.4 0l2.3 2.3 4.3-4.3a1 1 0 0 1 1.4 0L19 11.6V7H5Zm3.5 1a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3Z"/></svg>
          <span>Imagem</span>
        </label>
        <label class="switch">
          <input type="checkbox" id="customize">
          <span class="track" aria-hidden="true"></span>
          Texto por rede
        </label>
      </div>
    </div>

    <div id="overrides" class="overrides" hidden></div>
    <ul id="warnings" class="warnings" aria-live="polite"></ul>

    <div class="actions">
      <label class="switch">
        <input type="checkbox" id="dryRun">
        <span class="track" aria-hidden="true"></span>
        Simular <span class="muted small">(preenche, não publica)</span>
      </label>
      <button type="submit" id="submit" class="primary" title="Ctrl+Enter">Publicar</button>
    </div>
  </form>

  <section id="writer" class="card writer">
    <h2>Criar post <span class="muted small">com IA</span></h2>
    <div class="writer-row">
      <div class="segmented" id="writerNetworks" role="radiogroup" aria-label="Formatar para"></div>
      <select id="writerProvider" aria-label="Modelo"></select>
    </div>
    <label class="sr-only" for="idea">Ideia</label>
    <textarea id="idea" rows="4" placeholder="Escreva a ideia, mesmo curta. Ex.: migrei uma API Laravel para filas e o tempo de resposta caiu"></textarea>
    <div class="writer-actions">
      <span id="writerHint" class="muted small"></span>
      <button type="button" id="generate" class="primary">Gerar</button>
    </div>
    <p id="writerError" class="writer-error" hidden></p>
    <div id="draftBox" hidden>
      <div id="drafts" class="drafts"></div>
      <div class="writer-actions">
        <span class="muted small">Revise antes de publicar.</span>
        <button type="button" id="useDraft" class="ghost">Usar no post</button>
      </div>
    </div>
  </section>
  </div>

  <section id="progress" class="card" hidden>
    <h2>Envio</h2>
    <ul id="results" class="results"></ul>
  </section>

  <section class="card">
    <h2>Histórico</h2>
    <ul id="history" class="history"><li class="muted">Carregando…</li></ul>
  </section>
</main>
<script src="app.js" type="module"></script>
</body>
</html>
